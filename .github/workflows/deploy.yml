name: CI/CD PymeWeb

on:
  push:
    branches:
      - deploy

jobs:
  # ==========================================
  # 1. BASE DE DATOS
  # ==========================================
  deploy-database:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Deploy Database via SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_MYSQL_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["sudo docker pull mysql:8.0","sudo docker stop pymeweb-mysql || true","sudo docker rm pymeweb-mysql || true","sudo docker run -d --name pymeweb-mysql -p 3306:3306 -e MYSQL_ROOT_PASSWORD=rootpassword -e MYSQL_DATABASE=pymeweb -e MYSQL_USER=pymeweb_user -e MYSQL_PASSWORD=pymeweb_pass -v mysql_data:/var/lib/mysql mysql:8.0"]}' \
            --region us-east-1

  # ==========================================
  # 2. BACKEND
  # ==========================================
  deploy-backend:
    runs-on: ubuntu-latest
    needs: deploy-database
    steps:
      - name: Descargar Código
        uses: actions/checkout@v3

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build y Push Backend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/pymeweb-backend:latest ./proyecto/backend
          docker push ${{ secrets.DOCKER_USERNAME }}/pymeweb-backend:latest

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Deploy Backend via SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_BACKEND_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["sudo docker pull ${{ secrets.DOCKER_USERNAME }}/pymeweb-backend:latest","sudo docker stop pymeweb-backend || true","sudo docker rm pymeweb-backend || true","sudo docker run -d --name pymeweb-backend -p 8080:8080 -e MYSQL_HOST=${{ secrets.EC2_MYSQL_PRIVATE_IP }} -e MYSQL_DB=pymeweb -e MYSQL_USER=pymeweb_user -e MYSQL_PASSWORD=pymeweb_pass ${{ secrets.DOCKER_USERNAME }}/pymeweb-backend:latest"]}' \
            --region us-east-1

  # ==========================================
  # 3. FRONTEND
  # ==========================================
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Descargar Código
        uses: actions/checkout@v3

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build y Push Frontend
        run: |
          docker build \
            --build-arg VITE_API_URL=/api \
            -t ${{ secrets.DOCKER_USERNAME }}/pymeweb-frontend:latest \
            ./proyecto/frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/pymeweb-frontend:latest

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Deploy Frontend via SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_FRONTEND_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["sudo docker pull ${{ secrets.DOCKER_USERNAME }}/pymeweb-frontend:latest","sudo docker stop pymeweb-frontend || true","sudo docker rm pymeweb-frontend || true","sudo docker run -d --name pymeweb-frontend -p 80:80 -p 443:443 -v /etc/letsencrypt:/etc/letsencrypt:ro -v /var/www/certbot:/var/www/certbot ${{ secrets.DOCKER_USERNAME }}/pymeweb-frontend:latest"]}' \
            --region us-east-1