name: CI/CD Deploy

on:
  push:
    branches:
      - deploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build y Push backend
        uses: docker/build-push-action@v5
        with:
          context: ./proyecto/backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/pymeweb-backend:latest

      - name: Build y Push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./proyecto/frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/pymeweb-frontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Copiar repositorio a EC2 MySQL
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_MYSQL_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["cd /home/ec2-user/pymeweb && git clone https://github.com/${{ secrets.GH_USERNAME }}/${{ secrets.GH_REPO }}.git . 2>/dev/null || git pull"]}'

      - name: Copiar repositorio a EC2 Backend
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_BACKEND_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["cd /home/ec2-user/pymeweb && git clone https://github.com/${{ secrets.GH_USERNAME }}/${{ secrets.GH_REPO }}.git . 2>/dev/null || git pull"]}'

      - name: Copiar repositorio a EC2 Frontend
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_FRONTEND_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["cd /home/ec2-user/pymeweb && git clone https://github.com/${{ secrets.GH_USERNAME }}/${{ secrets.GH_REPO }}.git . 2>/dev/null || git pull"]}'

      - name: Esperar que git clone termine
        run: sleep 15

      - name: Deploy MySQL
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_MYSQL_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["cd /home/ec2-user/pymeweb/proyecto && docker compose --profile mysql pull && docker compose --profile mysql up -d"]}'

      - name: Deploy Backend
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_BACKEND_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["cd /home/ec2-user/pymeweb/proyecto && docker compose --profile backend pull && docker compose --profile backend up -d"]}'

      - name: Deploy Frontend
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_FRONTEND_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["cd /home/ec2-user/pymeweb/proyecto && docker compose --profile frontend pull && docker compose --profile frontend up -d"]}'