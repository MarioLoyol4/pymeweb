services:
  mysql:
    image: mysql:8.0
    container_name: pymeweb-mysql
    profiles: ["mysql"]
    ports:
      - "3306:3306" 
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - pymeweb-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${DOCKER_USERNAME}/pymeweb-backend:latest
    container_name: pymeweb-backend
    profiles: ["backend"]
    ports:
      - "8080:8080" 
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_DB: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - pymeweb-network

  frontend:
    image: ${DOCKER_USERNAME}/pymeweb-frontend:latest
    container_name: pymeweb-frontend
    profiles: ["frontend"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf 
      - /var/www/certbot:/var/www/certbot           
    networks:
      - pymeweb-network

volumes:
  mysql_data:

networks:
  pymeweb-network:
    driver: bridge


    