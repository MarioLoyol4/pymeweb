services:
  mysql:
    image: mysql:8.0
    container_name: pymeweb-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - pymeweb-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: pymeweb-backend
    environment:
      MYSQL_HOST: mysql
      MYSQL_DB: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - pymeweb-network

  frontend:
    build: ./frontend
    container_name: pymeweb-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - pymeweb-network

volumes:
  mysql_data:

networks:
  pymeweb-network:
    driver: bridge