server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Necesario para React Router (rutas como /negocio/1 no den 404)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy hacia el backend
    location /api/ {
        proxy_pass http://10.0.141.251:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}